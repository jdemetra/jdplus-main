syntax = "proto3";

package jdplus.main.ws;

/* Frequency of an event. Only regular frequencies higher or equal to yearly frequency are considered. */
enum Frequency {
  /* Undefined frequency. To be used when the frequency of an event is unknown. */
  FREQ_UNDEFINED = 0;
  /* One event by year */
  FREQ_YEARLY = 1;
  /* One event every half-year */
  FREQ_HALF_YEARLY = 2;
  /* One event every four months */
  FREQ_QUADRI_MONTHLY = 3;
  /* One event every quarter */
  FREQ_QUARTERLY = 4;
  /* One event every two months */
  FREQ_BI_MONTHLY = 6;
  /* One event every month */
  FREQ_MONTHLY = 12;
  /* One event every day */
  FREQ_DAILY = 365;
}

message Date {
  // Year of the date. Must be from 1 to 9999
  int32 year = 1;

  // Month of a year. Must be from 1 to 12, or 0 to specify a year without a
  // month and day.
  int32 month = 2;

  // Day of a month. Must be from 1 to 31 and valid for the year and month, or 0
  // to specify a year by itself or a year and month where the day isn't
  // significant.
  int32 day = 3;
}

message TsPeriod {
  Frequency frequency = 1;
  int32 year = 2;
  // position in the year (from 0 to annual_frequency excluded)
  int32 pos = 3;
}

message TsData {
  TsPeriod start = 1;
  repeated double values = 2;
}

message Matrix {
  int32 nrows = 1;
  int32 ncols = 2;
  // The number of values should be nrows*ncols. Values are organized by columns (1st columnn, 2nd column...)
  repeated double values = 3;
}

message TsMatrix {
  TsPeriod start = 1;
  Matrix values = 2;
}

message TsMoniker {
  string source = 1;
  string id = 2;
}

message Ts {
  string name = 1;
  TsMoniker moniker = 2;
  TsData data = 3;
  map<string, string> metadata = 4;
}

// Observation defined on a calendar period
message TsObservation {
  // For point observations, start should be equal to end
  // Otherwise, start is included in and end is excluded from the period corresponding to the observation
  Date start = 1;
  Date end = 2;
  double value = 3;
}

message TimeSeries {
  string name = 1;
  TsMoniker moniker = 2;
  repeated TsObservation observations = 3;
  map<string, string> metadata = 4;
}

enum SelectionType {
  SPAN_ALL = 0;
  SPAN_FROM = 1;
  SPAN_TO = 2;
  SPAN_BETWEEN = 3;
  SPAN_LAST = 4;
  SPAN_FIRST = 5;
  SPAN_EXCLUDING = 6;
  SPAN_NONE = 7;
}

message TimeSelector {
  SelectionType type = 1;
  int32 n0 = 2;
  int32 n1 = 3;
  Date d0 = 4;
  Date d1 = 5;
}

enum ResultStatusType {
  STATUS_OK = 0;
  STATUS_ERROR = 1;
  STATUS_WARNING = 2;
}

message ResultStatus {
  ResultStatusType type = 1;
  string message = 2;
}

/* Default input of TsFunctions (no additional parameter) */
message TsFunctionInput {
  string id = 1;
  TsData series = 2;
}

/* Default output of TsFunctions (no additional output) */
message TsFunctionOutput {
  string id = 1;
  ResultStatus status = 2;
  TsData series = 3;
}

/* Computes the percentage of variation (=[y(t)/y(t-lag)-1]*100) */
message PctInput {
  string id = 1;
  TsData series = 2;
  int32 lag = 3;
}

/* Apply <power> times the difference operator (y[t]-y[t-lag]) */
message DeltaInput {
  string id = 1;
  TsData series = 2;
  int32 lag = 3;
  int32 power = 4;
}


enum AggregationType {
  AGGREGATION_NONE = 0;
  AGGREGATION_SUM = 1;
  AGGREGATION_AVERAGE = 2;
  AGGREGATION_FIRST = 3;
  AGGREGATION_LAST = 4;
  AGGREGATION_MAX = 5;
  AGGREGATION_MIN = 6;
}

message AggregationInput {
  string id = 1;
  TsData series = 2;
  AggregationType aggregation_type = 3;
  Frequency new_frequency = 4;
  // only complete periods (all the months in the year...) are computed
  bool complete = 5;
}

message HodrickPrescottInput {
  string id = 1;
  TsData series = 2;
  int32 lambda = 3;
}

message HodrickPrescottOutput {
  string id = 1;
  ResultStatus status = 2;
  TsData trend = 3;
  TsData noise = 4;
}

message DescriptiveStatistics {

  string id = 1;
  ResultStatus status = 2;
  int32 n = 3;
  int32 nmissing = 4;
  double max = 5;
  double min = 6;
  double average = 7;
  double stdev = 8;
  double q25 = 10;
  double q50 = 11;
  double q75 = 12;
}

/* Parameters used when collecting observations in order to create time series. */
message ObsGathering {
  Frequency frequency = 1;
  AggregationType aggregation_type = 2;
  bool allow_partial_aggregation = 3;
  bool include_missing_values = 4;
}

message BuildTsDataObs {
  Date date = 1;
  double value = 2;
}

message BuildTsDataInput {
  string id = 1;
  ObsGathering gathering = 2;
  repeated BuildTsDataObs observations = 3;
}

enum DistributionType {
  DIST_FIRST = 0;
  DIST_LAST = 1;
  DIST_MIDDLE = 2;
}

message BuildTsDataTableInput {
  string id = 1;
  DistributionType distribution_type = 2;
  repeated TsData collection = 3;
}

enum ValueStatus {
  VS_PRESENT = 0;
  VS_UNUSED = 1;
  VS_BEFORE = 2;
  VS_AFTER = 3;
  VS_EMPTY = 4;
}

message BuildTsDataTableOutput {
  string id = 1;
  TsMatrix matrix = 2;
  repeated ValueStatus statuses = 3;
}